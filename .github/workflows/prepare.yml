name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Main SHA, tag or main~1; blank uses the release PR merge commit
        type: string
        default: ''
      tag-mode:
        description: Release tag format
        type: choice
        options: [rc, stable]
        default: rc
      rc-number:
        description: RC sequence, ignored for stable
        type: string
        default: '1'
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare or resume the release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      pending-sha: ${{ steps.selection.outputs.pending-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create or update the version PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Save the source and tag choices on the release PR
        id: selection
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          SOURCE_REF: ${{ inputs.source-ref }}
          TAG_MODE: ${{ inputs.tag-mode }}
          RC_NUMBER: ${{ inputs.rc-number }}
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { execFileSync } = require('node:child_process');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
            const { owner, repo } = context.repo;
            const mode = process.env.TAG_MODE;
            const rc = process.env.RC_NUMBER.trim();
            if (mode === 'rc' && !/^[1-9][0-9]*$/.test(rc)) throw new Error('Enter a positive RC number.');
            const ref = process.env.SOURCE_REF.trim();
            if (ref) git('branch', '--force', 'main', context.sha);
            const source = ref ? git('rev-parse', '--verify', '--end-of-options', `${ref}^{commit}`) : '';
            if (source) git('merge-base', '--is-ancestor', source, context.sha);

            let pr = JSON.parse(process.env.RELEASE_PR || 'null');
            if (!pr) {
              const version = require(`${process.env.GITHUB_WORKSPACE}/.release-please-manifest.json`)['.'];
              const closed = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'closed', base: 'main' });
              const pending = closed.filter(p => p.merged_at && p.title === `chore: PLT-1652 release ${version}` &&
                p.head.ref.startsWith('release-please--') && p.head.repo?.full_name === `${owner}/${repo}` &&
                p.labels.some(label => label.name === 'autorelease: pending'));
              if (pending.length !== 1) throw new Error('No unique pending release found. There may be no releasable changes.');
              pr = pending[0];
              core.setOutput('pending-sha', pr.merge_commit_sha);
            }
            const selection = { releaseSelection: true, sourceSha: source, tagMode: mode, rcNumber: rc };
            await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: JSON.stringify(selection, null, 2) });
            await core.summary.addRaw(`Release PR #${pr.number}: merge it to publish after DEV passes, or resume publication if already merged.`).write();

  publish:
    name: Publish after DEV passes
    needs: prepare
    if: >-
      always() && (
        (github.event_name == 'workflow_dispatch' && needs.prepare.result == 'success' &&
         needs.prepare.outputs.pending-sha != '') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         startsWith(github.event.workflow_run.head_commit.message, 'chore: PLT-1652 release '))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    env:
      RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || needs.prepare.outputs.pending-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read the approved version and saved source
        id: selection
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
            const { owner, repo } = context.repo;
            const commit = process.env.RELEASE_COMMIT;
            const version = require(`${process.env.GITHUB_WORKSPACE}/.release-please-manifest.json`)['.'];
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid Release Please version.');
            if (require(`${process.env.GITHUB_WORKSPACE}/package.json`).version !== version) throw new Error('Package and Release Please versions differ.');
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, { owner, repo, commit_sha: commit });
            const matches = prs.filter(p => p.merged_at && p.merge_commit_sha === commit && p.base.ref === 'main' &&
              p.title === `chore: PLT-1652 release ${version}` && p.head.ref.startsWith('release-please--') &&
              p.head.repo?.full_name === `${owner}/${repo}`);
            if (matches.length !== 1) throw new Error('Commit must be a merged Release Please PR.');
            const pr = matches[0];
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number });
            const selections = comments.filter(c => [owner, 'github-actions[bot]'].includes(c.user.login)).flatMap(c => {
              try { const value = JSON.parse(c.body); return value?.releaseSelection === true ? [value] : []; }
              catch { return []; }
            });
            const plan = selections.at(-1);
            if (!plan || !['rc', 'stable'].includes(plan.tagMode)) throw new Error('Missing valid release selection on the PR.');
            if (plan.tagMode === 'rc' && !/^[1-9][0-9]*$/.test(plan.rcNumber)) throw new Error('Invalid RC number.');
            const source = plan.sourceSha || commit;
            if (!/^[a-f0-9]{40}$/.test(source)) throw new Error('Source must be a full commit SHA.');
            git('merge-base', '--is-ancestor', source, commit);
            const sourceVersion = JSON.parse(git('show', `${source}:package.json`)).version;
            core.setOutput('sha', source);
            core.setOutput('pr', pr.number);
            core.setOutput('mode', plan.tagMode);
            core.setOutput('tag', `v${version}${plan.tagMode === 'rc' ? `-rc.${plan.rcNumber}` : ''}`);
            core.setOutput('source-version', sourceVersion);

      - name: Require a successful DEV run for that source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SOURCE_SHA: ${{ steps.selection.outputs.sha }}
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'build.yml', head_sha: process.env.SOURCE_SHA,
              event: 'push', status: 'success', per_page: 1
            });
            if (!data.total_count) throw new Error('The selected commit has not passed DEV.');

      - name: Publish or reuse the immutable tag and release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ steps.selection.outputs.tag }}
          SOURCE_SHA: ${{ steps.selection.outputs.sha }}
          SOURCE_VERSION: ${{ steps.selection.outputs.source-version }}
          RELEASE_PR: ${{ steps.selection.outputs.pr }}
          TAG_MODE: ${{ steps.selection.outputs.mode }}
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const repo = context.repo;
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.SOURCE_SHA;
            const prerelease = process.env.TAG_MODE === 'rc';
            const issue_number = Number(process.env.RELEASE_PR);
            async function find(request) {
              try { return (await request()).data; }
              catch (error) { if (error.status !== 404) throw error; return null; }
            }
            const ref = await find(() => github.rest.git.getRef({ ...repo, ref: `tags/${tag}` }));
            if (ref) {
              const { data } = await github.rest.repos.getCommit({ ...repo, ref: tag });
              if (data.sha !== sha) throw new Error(`${tag} points to another commit. Tags are never moved.`);
            } else {
              if (!prerelease) {
                const { data } = await github.rest.issues.listLabelsOnIssue({ ...repo, issue_number });
                if (!data.some(l => l.name === 'autorelease: pending')) throw new Error('Stable release is not pending.');
              }
              await github.rest.git.createRef({ ...repo, ref: `refs/tags/${tag}`, sha });
            }
            const existing = await find(() => github.rest.repos.getReleaseByTag({ ...repo, tag }));
            if (existing) {
              if (existing.draft || existing.prerelease !== prerelease) throw new Error('Existing release has a different publication mode.');
            } else {
              const body = `Source commit: ${sha}\nSource package version: ${process.env.SOURCE_VERSION}\nVersion metadata commit: ${process.env.RELEASE_COMMIT}\n\nThe selected source defines the included code. The version PR may describe newer changes.`;
              await github.rest.repos.createRelease({ ...repo, tag_name: tag, name: tag, body, prerelease, make_latest: 'false' });
            }
            if (!prerelease) {
              const { data } = await github.rest.issues.listLabelsOnIssue({ ...repo, issue_number });
              const labels = new Set(data.map(l => l.name).filter(name => name !== 'autorelease: pending'));
              labels.add('autorelease: tagged');
              await github.rest.issues.setLabels({ ...repo, issue_number, labels: [...labels] });
            }
            await core.summary.addRaw(`Published ${tag} at ${sha}. Run Deploy TEST with this tag.`).write();
