name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare the version PR, or create a tag after merging it
        type: choice
        options: [prepare, create-tag]
        default: prepare
      source-ref:
        description: Main commit SHA, tag or main~1; blank selects this run's main commit
        type: string
        default: ''
      tag-mode:
        description: Tag format using the merged Release Please version
        type: choice
        options: [rc, stable]
        default: rc
      rc-number:
        description: Positive RC sequence, ignored in stable mode
        type: string
        default: '1'


permissions:
  contents: read

defaults:
  run:
    shell: bash

# Serialize preparation with release publication to protect the same lifecycle.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the version PR only
    if: github.ref == 'refs/heads/main' && inputs.operation == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Calculate the next version with Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Explain the next step
        run: |
          echo 'Review the Release Please PR, pass its CI checks and merge it.' >> "$GITHUB_STEP_SUMMARY"
          echo 'After merging, run this workflow with operation=create-tag and the desired source-ref, then Deploy TEST with its tag. Preparation creates no tag or deployment.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish the approved version on the selected source
    if: github.ref == 'refs/heads/main' && inputs.operation == 'create-tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      SOURCE_REF: ${{ inputs.source-ref || github.sha }}
      TAG_MODE: ${{ inputs.tag-mode }}
      RC_NUMBER: ${{ inputs.rc-number }}
    steps:
      - name: Check out trusted main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and freeze the selected source
        run: |
          git branch --force main "$GITHUB_SHA"
          sha=$(git rev-parse --verify --end-of-options "${SOURCE_REF}^{commit}")
          git merge-base --is-ancestor "$sha" "$GITHUB_SHA" || { echo 'Select a commit from main history.'; exit 1; }
          echo "SOURCE_SHA=$sha" >> "$GITHUB_ENV"
          git show "$sha:package.json" > source-package.json

      - name: Require the selected source to have passed DEV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
            -f head_sha="$SOURCE_SHA" -f event=push -f status=success -f per_page=1 \
            --jq '.total_count > 0' | grep -qx true

      - name: Read the version from merged Release Please metadata
        run: |
          metadata_sha=$(git log "$GITHUB_SHA" -1 --format=%H --grep='^chore: PLT-1652 release [0-9]')
          [[ -n "$metadata_sha" ]] || { echo 'Merge a Release Please version PR first.'; exit 1; }
          git show "$metadata_sha:.release-please-manifest.json" > version-manifest.json
          version=$(jq -er '.["."] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' version-manifest.json)
          git show "$GITHUB_SHA:.release-please-manifest.json" | jq -e --arg v "$version" '.["."] == $v'
          git show "$GITHUB_SHA:package.json" | jq -e --arg v "$version" '.version == $v'
          gh api "repos/$GITHUB_REPOSITORY/commits/$metadata_sha/pulls" > metadata-prs.json
          pr=$(jq -er --arg sha "$metadata_sha" --arg title "chore: PLT-1652 release $version" '[.[] |
            select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == "main" and
            .title == $title and (.head.ref | startswith("release-please--")) and
            .head.repo.full_name == .base.repo.full_name)] |
            if length == 1 then .[0].number else error("No matching merged Release Please PR") end' metadata-prs.json)
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "METADATA_SHA=$metadata_sha" >> "$GITHUB_ENV"
          echo "RELEASE_PR=$pr" >> "$GITHUB_ENV"

      - name: Select the tag and describe its actual source
        run: |
          tag="v$RELEASE_VERSION"
          if [[ "$TAG_MODE" == 'rc' ]]; then
            [[ "$RC_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'RC number must be a positive integer.'; exit 1; }
            tag="$tag-rc.$RC_NUMBER"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          package_version=$(jq -er '.version' source-package.json)
          printf 'Release version: %s\nSource commit: %s\nSource package version: %s\nVersion metadata commit: %s\n\nThe selected source commit defines the included code. The version PR changelog may contain newer changes excluded from this source.\n' \
            "$tag" "$SOURCE_SHA" "$package_version" "$METADATA_SHA" > release-notes.md

      - name: Create the tag or reuse its exact commit
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > tag.json 2> tag-error.log; then
            actual_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')
            [[ "$actual_sha" == "$SOURCE_SHA" ]] || { echo "::error::$RELEASE_TAG already points to another commit. Prepare a new version or choose another RC number."; exit 1; }
          elif grep -q 'HTTP 404' tag-error.log; then
            if [[ "$TAG_MODE" == 'stable' ]]; then
              gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_PR/labels" \
                --jq 'any(.[]; .name == "autorelease: pending")' | grep -qx true
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$SOURCE_SHA"
          else
            cat tag-error.log >&2
            exit 1
          fi

      - name: Publish or reuse the release without changing existing notes
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json 2> release-error.log; then
            jq -e --arg mode "$TAG_MODE" '.draft == false and .prerelease == ($mode == "rc")' release.json
          elif grep -q 'HTTP 404' release-error.log; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" \
              --notes-file release-notes.md --latest=false --prerelease="$([[ "$TAG_MODE" == 'rc' ]] && echo true || echo false)"
          else
            cat release-error.log >&2
            exit 1
          fi

      - name: Advance Release Please lifecycle after stable publication
        if: inputs.tag-mode == 'stable'
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_PR/labels" \
            --jq '{labels: ([.[].name | select(. != "autorelease: pending")] + ["autorelease: tagged"] | unique)}' > published-labels.json
          gh api --method PUT "repos/$GITHUB_REPOSITORY/issues/$RELEASE_PR/labels" --input published-labels.json

      - name: Record the immutable release selection
        run: |
          echo "Created or reused $RELEASE_TAG at $SOURCE_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo 'Run Deploy TEST with this release-tag. DEV continues following main.' >> "$GITHUB_STEP_SUMMARY"
