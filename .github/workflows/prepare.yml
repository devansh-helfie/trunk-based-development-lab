name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Main SHA, tag or main~1; blank uses the release PR merge commit
        type: string
        default: ''
      tag-mode:
        description: Release tag format
        type: choice
        options: [rc, stable]
        default: rc
      rc-number:
        description: RC sequence, ignored for stable
        type: string
        default: '1'
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare or resume the release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      pending-sha: ${{ steps.selection.outputs.pending-sha }}
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the source and RC number
        id: source
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
          TAG_MODE: ${{ inputs.tag-mode }}
          RC_NUMBER: ${{ inputs.rc-number }}
        run: |
          ref=$(jq -rn --arg value "$SOURCE_REF" '$value | gsub("^\\s+|\\s+$"; "")')
          sha=''
          if [[ -n "$ref" ]]; then
            git branch --force main "$GITHUB_SHA"
            sha=$(git rev-parse --verify --end-of-options "${ref}^{commit}")
            git merge-base --is-ancestor "$sha" "$GITHUB_SHA"
          fi
          if [[ "$TAG_MODE" == rc ]]; then
            [[ "$RC_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Enter a positive RC number.'; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Create or update the version PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Select the new or pending release PR
        id: selection
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          if [[ -n "$RELEASE_PR" ]]; then
            pr=$(jq -er '.number' <<< "$RELEASE_PR")
          else
            version=$(jq -er '.["."]' .release-please-manifest.json)
            pr=$(gh pr list --state merged --base main --label 'autorelease: pending' --json number,title,headRefName \
              | jq -r --arg title "chore: PLT-1652 release $version" \
                '.[] | select(.title == $title and (.headRefName | startswith("release-please--"))) | .number')
            [[ "$pr" =~ ^[0-9]+$ ]] || { echo 'No unique pending release found. There may be no releasable changes.'; exit 1; }
            pending_sha=$(gh pr view "$pr" --json mergeCommit --jq '.mergeCommit.oid')
            echo "pending-sha=$pending_sha" >> "$GITHUB_OUTPUT"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Save release choices for automatic publication
        env:
          RELEASE_PR: ${{ steps.selection.outputs.pr }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TAG_MODE: ${{ inputs.tag-mode }}
          RC_NUMBER: ${{ inputs.rc-number }}
        run: |
          jq -n --arg sha "$SOURCE_SHA" --arg mode "$TAG_MODE" --arg rc "$RC_NUMBER" \
            '{releaseSelection: true, sourceSha: $sha, tagMode: $mode, rcNumber: $rc}' \
            | gh pr comment "$RELEASE_PR" --body-file -
          echo "Release PR #$RELEASE_PR: merge to publish after DEV passes, or resume if already merged." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish after DEV passes
    needs: prepare
    if: >-
      always() && (
        (github.event_name == 'workflow_dispatch' && needs.prepare.result == 'success' &&
         needs.prepare.outputs.pending-sha != '') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         startsWith(github.event.workflow_run.head_commit.message, 'chore: PLT-1652 release '))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || needs.prepare.outputs.pending-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read the merged Release Please version and PR
        run: |
          version=$(jq -er '.["."] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' .release-please-manifest.json)
          jq -e --arg version "$version" '.version == $version' package.json
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_COMMIT/pulls" \
            | jq -er --arg sha "$RELEASE_COMMIT" --arg title "chore: PLT-1652 release $version" --arg repo "$GITHUB_REPOSITORY" \
              '[.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == "main" and
              .title == $title and (.head.ref | startswith("release-please--")) and .head.repo.full_name == $repo)] |
              if length == 1 then .[0].number else error("Commit must be a merged Release Please PR") end')
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_PR=$pr" >> "$GITHUB_ENV"

      - name: Load the saved source and tag choices
        run: |
          selection=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$RELEASE_PR/comments?per_page=100" \
            | jq -ec --arg owner "$GITHUB_REPOSITORY_OWNER" '[.[][] |
              select(.user.login == $owner or .user.login == "github-actions[bot]") |
              .body | fromjson? | objects | select(.releaseSelection == true)] |
              last // error("No saved release selection on the PR")')
          sha=$(jq -er --arg fallback "$RELEASE_COMMIT" '.sourceSha | if . == "" then $fallback else . end |
            select(test("^[a-f0-9]{40}$"))' <<< "$selection")
          mode=$(jq -er '.tagMode | select(. == "rc" or . == "stable")' <<< "$selection")
          tag="v$RELEASE_VERSION"
          prerelease=false
          if [[ "$mode" == rc ]]; then
            rc=$(jq -er '.rcNumber | select(test("^[1-9][0-9]*$"))' <<< "$selection")
            tag="$tag-rc.$rc"
            prerelease=true
          fi
          echo "SOURCE_SHA=$sha" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"

      - name: Verify the source belongs to main
        run: |
          git merge-base --is-ancestor "$SOURCE_SHA" "$RELEASE_COMMIT"
          version=$(git show "$SOURCE_SHA:package.json" | jq -er '.version')
          echo "SOURCE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Require the latest DEV run for that source to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          result=$(gh run list --workflow build.yml --commit "$SOURCE_SHA" --event push \
            --limit 1 --json status,conclusion --jq '.[0] | .status == "completed" and .conclusion == "success"')
          [[ "$result" == true ]] || { echo 'The latest DEV run for this source must pass before promotion.'; exit 1; }

      - name: Create the tag or reuse its exact commit
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            [[ "$sha" == "$SOURCE_SHA" ]] || { echo 'Tag points to another commit. Tags are never moved.'; exit 1; }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$SOURCE_SHA"
          fi

      - name: Publish or reuse the GitHub Release
        run: |
          release=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first // empty')
          if [[ -n "$release" ]]; then
            jq -e --argjson prerelease "$PRERELEASE" '.draft == false and .prerelease == $prerelease' <<< "$release"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --prerelease="$PRERELEASE" \
              --notes "Source commit: $SOURCE_SHA
          Source package version: $SOURCE_VERSION
          Version metadata commit: $RELEASE_COMMIT

          The selected source defines included code. The version PR may describe newer changes."
          fi

      - name: Mark stable release published
        if: env.PRERELEASE == 'false'
        run: |
          gh pr edit "$RELEASE_PR" --remove-label 'autorelease: pending' --add-label 'autorelease: tagged'

      - name: Show the tag to deploy
        run: echo "Published $RELEASE_TAG at $SOURCE_SHA. Run Deploy TEST with this tag." >> "$GITHUB_STEP_SUMMARY"
