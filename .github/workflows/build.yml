name: Build

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ''
      environment:
        type: string
        default: DEV
      release-tag:
        type: string
        default: unreleased

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.environment || 'DEV' }}-${{ inputs.source-ref || github.sha }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      source-ref: ${{ inputs.source-ref || github.sha }}

  publish:
    name: Build the demo image
    needs: ci
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false

      - name: Record the selected source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the demo image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/devansh-helfie/trunk-based-development-lab:build-${{ inputs.environment || 'DEV' }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            COMMIT_SHA=${{ steps.source.outputs.sha }}
            BUILD_RUN_ID=${{ github.run_id }}

      # The attestation identity must match the event SHA. Release rebuilds may
      # check out an older release commit, so attestation remains on main builds.
      - name: Attest the main image
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/devansh-helfie/trunk-based-development-lab
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  deploy:
    name: Deploy ${{ inputs.environment || 'DEV' }}
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      image-digest: ${{ needs.publish.outputs.digest }}
      source-sha: ${{ needs.publish.outputs.source-sha }}
      environment: ${{ inputs.environment || 'DEV' }}
      release-tag: ${{ inputs.release-tag || 'unreleased' }}
