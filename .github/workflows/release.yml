name: Deploy TEST

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing tag to deploy, for example v2.1.0-rc.1 or v2.1.0
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: test-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Resolve the existing tag and verify DEV
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      package-version: ${{ steps.source.outputs.package-version }}
      release-tag: ${{ steps.source.outputs.release-tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release-tag }}
    steps:
      - name: Check out trusted main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the tag to its main commit
        id: source
        run: |
          # Remove surrounding whitespace while preserving invalid spaces inside a tag.
          RELEASE_TAG="$(printf '%s' "$RELEASE_TAG" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]] || { echo 'Enter an existing version tag.'; exit 1; }
          sha=$(git rev-parse --verify --end-of-options "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" "$GITHUB_SHA" || { echo 'The tag must point to main history.'; exit 1; }
          git show "$sha:package.json" > source-package.json
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release-tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "package-version=$(jq -er '.version' source-package.json)" >> "$GITHUB_OUTPUT"

      - name: Require that exact source to have passed DEV
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
            -f head_sha="$SOURCE_SHA" -f event=push -f status=success -f per_page=1 \
            --jq '.total_count > 0' | grep -qx true

  test:
    name: Build and deploy TEST
    needs: validate
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      source-ref: ${{ needs.validate.outputs.sha }}
      environment: TEST
      release-tag: ${{ needs.validate.outputs.release-tag }}

  qa:
    name: Run QA against TEST
    needs: [validate, test]
    runs-on: [self-hosted, macOS, ARM64, trunk-lab-deploy]
    timeout-minutes: 10
    outputs:
      configuration: ${{ steps.target.outputs.configuration }}
    env:
      BASE_URL: http://127.0.0.1:3002
      QA_EXPECT_BULK_DISCOUNT: 'true'
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      RELEASE_TAG: ${{ needs.validate.outputs.release-tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.package-version }}
    steps:
      - name: Check out the release QA checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install the locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the real pricing and configuration checks
        run: npm run test:qa

      - name: Record the verified TEST configuration
        id: target
        run: |
          curl --fail --silent --show-error "$BASE_URL/version" > qa-target.json
          jq -e --arg sha "$RELEASE_SHA" --arg tag "$RELEASE_TAG" --arg version "$RELEASE_VERSION" \
            '.environment == "TEST" and .commitSha == $sha and .releaseIdentity == $tag and
             ($version == "" or .version == $version)' qa-target.json
          echo "configuration=$(jq -r '.configurationId' qa-target.json)" >> "$GITHUB_OUTPUT"

      - name: Summarize the TEST result
        env:
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "TEST QA passed for $RELEASE_SHA ($RELEASE_TAG)." >> "$GITHUB_STEP_SUMMARY"
          echo "Evidence: $GH_RUN_URL. No PROD deployment was created." >> "$GITHUB_STEP_SUMMARY"
