name: Deploy TEST

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing tag to deploy, for example v2.2.0-rc.1 or v2.2.0
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: test-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and DEV result
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Trim and resolve the release tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          tag=$(jq -rn --arg value "$RELEASE_TAG" '$value | gsub("^\\s+|\\s+$"; "")')
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]] || { echo 'Enter an existing version tag.'; exit 1; }
          sha=$(git rev-parse --verify --end-of-options "refs/tags/$tag^{commit}")
          git merge-base --is-ancestor "$sha" "$GITHUB_SHA"
          version=$(git show "$sha:package.json" | jq -er '.version')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Require a successful DEV run for that source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          run=$(gh run list --workflow build.yml --commit "$SOURCE_SHA" --event push --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [[ -n "$run" ]] || { echo 'The tagged commit has not passed DEV.'; exit 1; }

  test:
    name: Build and deploy TEST
    needs: validate
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      source-ref: ${{ needs.validate.outputs.sha }}
      environment: TEST
      release-tag: ${{ needs.validate.outputs.tag }}

  qa:
    name: Run QA against TEST
    needs: [validate, test]
    runs-on: [self-hosted, macOS, ARM64, trunk-lab-deploy]
    timeout-minutes: 10
    env:
      BASE_URL: http://127.0.0.1:3002
      QA_EXPECT_BULK_DISCOUNT: 'true'
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run pricing and configuration checks
        run: npm run test:qa

      - name: Verify the deployed release and record QA evidence
        run: |
          curl --fail --silent --show-error "$BASE_URL/version" > qa-version.json
          jq -e --arg sha "$RELEASE_SHA" --arg tag "$RELEASE_TAG" --arg version "$RELEASE_VERSION" \
            '.environment == "TEST" and .commitSha == $sha and .releaseIdentity == $tag and .version == $version' qa-version.json
          jq --arg run "$GITHUB_RUN_ID" '. + {qaRunId: $run}' qa-version.json > qa-verification.json
          configuration=$(jq -r '.configurationId' qa-version.json)
          echo "TEST QA passed for $RELEASE_TAG at $RELEASE_SHA. Configuration: $configuration." >> "$GITHUB_STEP_SUMMARY"
          echo "Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Save successful TEST verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-qa-${{ needs.validate.outputs.tag }}
          path: qa-verification.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
