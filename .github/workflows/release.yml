name: Deploy TEST

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing tag to deploy, for example v2.2.0-rc.1 or v2.2.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: test-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and DEV result
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the tag and require successful DEV
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
            const tag = process.env.RELEASE_TAG.trim();
            if (!/^v\d+\.\d+\.\d+(-rc\.[1-9][0-9]*)?$/.test(tag)) throw new Error('Enter an existing version tag.');
            const sha = git('rev-parse', '--verify', '--end-of-options', `refs/tags/${tag}^{commit}`);
            git('merge-base', '--is-ancestor', sha, context.sha);
            const version = JSON.parse(git('show', `${sha}:package.json`)).version;
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'build.yml', head_sha: sha,
              event: 'push', status: 'success', per_page: 1
            });
            if (!data.total_count) throw new Error('The tagged commit has not passed DEV.');
            core.setOutput('sha', sha);
            core.setOutput('version', version);
            core.setOutput('tag', tag);

  test:
    name: Build and deploy TEST
    needs: validate
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      source-ref: ${{ needs.validate.outputs.sha }}
      environment: TEST
      release-tag: ${{ needs.validate.outputs.tag }}

  qa:
    name: Run QA against TEST
    needs: [validate, test]
    runs-on: [self-hosted, macOS, ARM64, trunk-lab-deploy]
    timeout-minutes: 10
    env:
      BASE_URL: http://127.0.0.1:3002
      QA_EXPECT_BULK_DISCOUNT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run pricing and configuration checks
        run: npm run test:qa

      - name: Verify the deployed release and record QA evidence
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        with:
          script: |
            const response = await fetch(`${process.env.BASE_URL}/version`);
            if (!response.ok) throw new Error('TEST version endpoint failed.');
            const version = await response.json();
            if (version.environment !== 'TEST' || version.commitSha !== process.env.RELEASE_SHA ||
                version.releaseIdentity !== process.env.RELEASE_TAG || version.version !== process.env.RELEASE_VERSION) {
              throw new Error('TEST is not running the selected release.');
            }
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await core.summary.addRaw(`TEST QA passed for ${process.env.RELEASE_TAG} at ${version.commitSha}.\n\nConfiguration: ${version.configurationId}\n\nEvidence: ${run}`).write();
