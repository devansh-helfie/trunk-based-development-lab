name: Deploy

on:
  workflow_call:
    inputs:
      image-digest:
        description: Image built by the current workflow run
        required: true
        type: string
      source-sha:
        required: true
        type: string
      environment:
        type: string
        default: DEV
      release-tag:
        type: string
        default: unreleased

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  app:
    name: Deploy ${{ inputs.environment }}
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, macOS, ARM64, trunk-lab-deploy]
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: personal-trunk-lab-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      LAB_IMAGE: ghcr.io/devansh-helfie/trunk-based-development-lab@${{ inputs.image-digest }}
      IMAGE_DIGEST: ${{ inputs.image-digest }}
      COMMIT_SHA: ${{ inputs.source-sha }}
      APP_ENV: ${{ inputs.environment }}
      ENVIRONMENT_SLUG: ${{ inputs.environment == 'PROD' && 'prod' || inputs.environment == 'TEST' && 'test' || 'dev' }}
      APP_PORT: ${{ inputs.environment == 'PROD' && '3003' || inputs.environment == 'TEST' && '3002' || '3001' }}
      RELEASE_IDENTITY: ${{ inputs.release-tag }}
      QA_DEMO: ${{ vars.QA_DEMO || 'pass' }}
      DEMO_FAULT: ${{ inputs.environment == 'TEST' && vars.QA_DEMO == 'fail' && 'discount-boundary' || 'none' }}
      BUILD_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Require a stable version tag for PROD
        if: inputs.environment == 'PROD'
        run: |
          [[ "$RELEASE_IDENTITY" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'PROD requires a stable version tag.'; exit 1; }

      - name: Validate the TEST demonstration setting
        if: inputs.environment == 'TEST'
        run: |
          case "$QA_DEMO" in
            pass|fail) ;;
            *) echo 'Set the TEST environment variable QA_DEMO to pass or fail.'; exit 1 ;;
          esac

      - name: Check out trusted deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Docker Desktop and local environment settings
        run: |
          echo '/Applications/Docker.app/Contents/Resources/bin' >> "$GITHUB_PATH"
          echo "DOCKER_HOST=unix://$HOME/.docker/run/docker.sock" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/trunk-lab-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "APP_ENV_FILE=$HOME/.local/share/trunk-based-development-lab/environments/$ENVIRONMENT_SLUG/.env" >> "$GITHUB_ENV"

      - name: Use private file-based credentials instead of macOS Keychain
        run: |
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          printf '{"credHelpers":{"ghcr.io":""},"cliPluginsExtraDirs":["/Applications/Docker.app/Contents/Resources/cli-plugins"]}\n' > "$DOCKER_CONFIG/config.json"

      - name: Sign in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy the demo environment
        run: |
          test -f "$APP_ENV_FILE" || { echo 'Run scripts/setup-env.sh for this environment on the Mac first.'; exit 1; }
          docker compose --project-name "trunk-lab-$ENVIRONMENT_SLUG" --env-file "$APP_ENV_FILE" \
            --file compose.demo.yaml up --detach --no-build --pull always --wait --wait-timeout 90

      - name: Check the running version
        run: |
          curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:$APP_PORT/version" |
            jq -e --arg environment "$APP_ENV" --arg sha "$COMMIT_SHA" --arg digest "$IMAGE_DIGEST" --arg tag "$RELEASE_IDENTITY" \
              '.environment == $environment and .commitSha == $sha and .imageDigest == $digest and .releaseIdentity == $tag'
